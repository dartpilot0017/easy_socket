version: 0.1.1
repository: https://github.com/dartpilot0017/easy_socket
issue_tracker: https://github.com/dartpilot0017/easy_socket/issues
topics:
  - websocket
  - socket
  - realtime
  - networking

environment:
  sdk: ^3.8.0

dependencies:
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  stream_channel: ^2.1.4
  test: ^1.26.0
