# Opens pull requests for dependency and GitHub Action updates, which then go
# through the same checks and review as any other change.
#
# They target dev, like every other pull request: main only accepts dev
# (the required `from-dev` check).
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
